name: Build & Release Wiz

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re; print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"', open('wiz/main.py').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version

    if: needs.check-version.outputs.changed == 'true'

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            exe: wiz-linux

          - os: windows-latest
            exe: wiz.exe

          - os: macos-latest
            exe: wiz-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pyinstaller

      - name: Build
        run: |
          pyinstaller \
            --onefile \
            --name "${{ matrix.exe }}" \
            wiz/main.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.exe }}
          path: |
            dist/${{ matrix.exe }}
            dist/${{ matrix.exe }}.exe

  release:
    needs:
      - check-version
      - build

    if: needs.check-version.outputs.changed == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s")
          else
            LOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s")
          fi

          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo
            echo "$LOG"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Wiz v${{ needs.check-version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            artifacts/**/*