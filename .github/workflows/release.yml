name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if main.py changed
        id: changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^wiz/main.py$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if not changed
        if: steps.changed.outputs.changed != 'true'
        run: |
          echo "wiz/main.py not changed."
          exit 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re,pathlib;text=pathlib.Path('wiz/main.py').read_text(encoding='utf-8');print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"', text).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.release.outputs.exists == 'false'
        run: |
          pyinstaller --onefile --name wiz wiz/main.py

      - name: Create Release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "v${{ steps.version.outputs.version }}" \
            dist/wiz \
            --title "Wiz v${{ steps.version.outputs.version }}" \
            --notes "Automatic release"